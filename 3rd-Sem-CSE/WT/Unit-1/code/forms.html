<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms</title>
  </head>
  <body style="display: flex; justify-content: center">
    <div style="width: 50%">
      <form  action="#">
        <table border="0" cellspacing="1" cellpadding="5" width="100%">
          <tr>
            <th colspan="2">Enter Your Info</th>
          </tr>
          <tr>
            <td colspan="2" align="center">
              <fieldset>
                <legend>Additional input types</legend>

                <label for="passwd">Password</label>
                <input type="password" id="passwd" name="password" placeholder="Enter password" />
                <br />

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required />
                <br />

                <label for="tel">Telephone</label>
                <input type="tel" id="tel" name="tel" placeholder="555-555-5555" pattern="[0-9]{10}" />
                <br />

                <label for="url">Website</label>
                <input type="url" id="url" name="url" placeholder="https://example.com" />
                <br />

                <label for="search">Search</label>
                <input type="search" id="search" name="search" />
                <br />

                <label for="number">Number</label>
                <input type="number" id="number" name="number" min="0" max="100" />
                <br />

                <label for="range">Range</label>
                <input type="range" id="range" name="range" min="0" max="10" />
                <br />

                <label for="color">Color</label>
                <input type="color" id="color" name="color" value="#ff0000" />
                <br />

                <label for="file">File</label>
                <input type="file" id="file" name="file" />
                <br />

                <label for="month">Month</label>
                <input type="month" id="month" name="month" />
                <br />

                <label for="week">Week</label>
                <input type="week" id="week" name="week" />
                <br />

                <label for="time">Time</label>
                <input type="time" id="time" name="time" />
                <br />

                <label for="datetime">Datetime</label>
                <input type="datetime-local" id="datetime" name="datetime" />
                <br />

                <label for="dlist">Datalist</label>
                <input list="browsers" id="dlist" name="dlist" />
                <datalist id="browsers">
                  <option value="Chrome">
                  <option value="Firefox">
                  <option value="Edge">
                  <option value="Safari">
                </datalist>
                <br />

                <label>Output</label>
                <output name="result" for="number range">0</output>
                <br />

                <label for="meter">Meter (example)</label>
                <meter id="meter" value="0.6">60%</meter>
                <br />

                <label for="progress">Progress (example)</label>
                <progress id="progress" value="30" max="100">30%</progress>
                <br />

                <input type="hidden" name="hidden_token" value="abc123" />

                <button type="button" onclick="alert('Button clicked')">Button</button>
                <input type="image" src="./trump.png" alt="submit-image" width="50" />

              </fieldset>
            </td>
          </tr>
          <tr>
            <td>
              <label for="Name">Enter Your Name</label>
              <br />
              <input
                type="text"
                name="Name"
                size="40"
                maxlength="30"
                placeholder="e.g. Bin Laden"
                required
              />
            </td>
            <td>
              <label for="date">Enter Your Birt day</label>
              <br />
              <input type="date" name="date" />
            </td>
          </tr>
          <tr>
            <td>
              <label>Enter Your Place Of Choice</label><br />
              <input type="checkbox" name="c1" value="0" />Twin Towers, NYC<br />
              <input type="checkbox" name="c1" />Marathon, Boston<br />
              <input type="checkbox" name="c1" />Subway, Tokyo<br />
              <input type="checkbox" name="c1" />Olympics, Germany<br />
            </td>
            <td>
              <label>Enter Prefereed Date</label><br />
              <input type="radio" name="r1" />September 11<br />
              <input type="radio" name="r1" />October 7<br />
              <!--For them to work as radio, they must have the same `name`-->
            </td>
          </tr>
          <tr>
            <td colspan="2" align="center">
              <select name="drop" style="width: 100px">
                <option value="html">HTML</option>
                <option value="css">CSS</option>
                <option selected value="react">React Js</option>
                <option value="node">Node Js</option>
                <option selected value="express">Express Js</option>
              </select>
            </td>
          </tr>
          <tr>
            <td colspan="2" align="center">
              <select name="drop" multiple style="width: 200px; height: 150px">
                <option selected value="html">HTML</option>
                <option value="css">CSS</option>
                <option selected value="react">React Js</option>
                <option value="node">Node Js</option>
                <option value="express">Express Js</option>
              </select>
            </td>
          </tr>
          <tr>
            <td colspan="2" align="center">
              <textarea name="comments" id="ucomments" rows="12" cols="100">
Send your comments to us.</textarea
              >
            </td>
          </tr>
          <tr>
            <td align="center">
              <input type="submit" />
            </td>
            <td align="center">
              <input type="reset" />
            </td>
          </tr>
        </table>
      </form>
    </div>
  </body>
</html>
