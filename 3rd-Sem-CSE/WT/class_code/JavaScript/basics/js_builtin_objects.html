<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      //hoisting
      hello();
      function hello(){
        console.log("Hello");
      }
      a = 10;
      b = 5
      c = 7
      function hoist(){
        if(true){
          a = 20;
          const b = 10
          let c = 9;
          console.log("if: ", a, b, c);
        }
        console.log("in func: ", a, b, c);
      }
      console.log("outside before call: ", a, b, c);
      console.log("called");
      hoist();
      console.log("outside after call: ", a, b, c);
      console.log("-------------------------------------------------");
      hoist();
      //arrays
      var arr1 = ["one", "two", "three"];
      console.log("array: ", arr1);
      arr1.push("four");
      console.log("array: ", arr1);
      arr1.pop();
      console.log("array: ", arr1);
      var x = 10;
      console.log("Converted: ", x.toString(), typeof x.toString());
      var arr2 = ["abc", "efg", "hij"];
      console.log("Joined: ", arr1.join(arr2));
      console.log("Concat: ", arr1.concat(arr2));
      var clr = ["red", "green", "white", "aquamarine", "purple"]
      console.log(clr)
      //console.log(clr.shift())
      console.log("unshift: ", clr.unshift("black"));
      console.log(clr)
      console.log("slice: ", clr.slice(1, 3));
      console.log("splice: ", clr.splice(2, 4));
      console.log("splice: ", clr.splice(2, 2, "white", "purple"));
      console.log("splice 2: ", clr);
      delete clr[1];
      console.log("reverse: ", clr.reverse());
      console.log("sort: ", clr.sort());
      var arrnum = [5, 6, 1, 3, 8];
      console.log(arrnum.sort())
      arrnum = [4, 2, 13, 5, 1, 3, 11];
      arrnum.sort(function(a, b)
      {return b - a; });
    console.log(arrnum);
    </script>
    <style>
      html {
        background-color: cadetblue;
      }
      html:hover{
        background-color: cornflowerblue;
      }
      h1{
        text-align: center;
        margin-top: 50vh;
        text-shadow: 10px 5px 10px;
      }
      span {
        border: 5px solid black;
        border-radius: 10px;
        padding: 10px;
        background-color: aquamarine;
      }
      span:hover{
        background-color: blanchedalmond;
      }
    </style>
  </head>
  <body>
    <h1><span>HTML BUILT-IN Objects</span></h1>
  </body>
</html>
